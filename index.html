<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avaliação da sessão</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap">
<style>
  /* Página de avaliação da sessão (QR do card). Fica fora do Google para abrir em qualquer celular,
     com qualquer conta logada. Lê os dados da sessão e envia as respostas ao Painel da Implantação. */
  :root { --bg: #FFFFFF; --fg: #111111; --muted: #8A8A8A; --line: #E6E6E6; --ok: #2E9A47; --bad: #D93A2B; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.45; padding: 28px 16px 40px; }
  main { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  h1 { font-size: 30px; font-weight: 700; margin: 0; } h2 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); margin: 4px 0 0; }
  .sessao { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; padding-top: 18px; border-top: 1px solid var(--line); }
  .k { font-size: 12px; color: var(--muted); } .v { font-weight: 600; }
  form { display: flex; flex-direction: column; gap: 26px; }
  .q { display: flex; flex-direction: column; gap: 10px; border: 0; padding: 0; margin: 0; min-width: 0; }
  .q > legend, .q > label { font-weight: 600; padding: 0; margin-bottom: 10px; }
  input[type=text] { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 100%; box-sizing: border-box; }
  .opcoes { display: flex; gap: 6px; flex-wrap: wrap; }
  .opcoes button { font: inherit; flex: 1 1 0; min-width: 52px; min-height: 48px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); cursor: pointer; }
  .opcoes button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .escala { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .enviar { font: inherit; font-weight: 600; min-height: 52px; border: 0; border-radius: 12px; background: var(--fg); color: var(--bg); cursor: pointer; }
  .enviar:disabled { opacity: .5; }
  .erro { color: var(--bad); font-size: 14px; min-height: 1em; margin: -14px 0 0; }
  .aviso { text-align: center; padding: 32px 0; display: flex; flex-direction: column; gap: 8px; }
  .marca { font-size: 40px; color: var(--ok); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <p class="sub" id="carregando" style="text-align:center;padding:40px 0">Carregando…</p>

  <div id="cab" hidden>
    <header><p class="eyebrow">Avaliação da sessão</p><h1 id="cli"></h1><p class="sub" id="ct"></p></header>
  </div>
  <section class="sessao" id="dados" hidden>
    <div><div class="k">Data</div><div class="v" id="data"></div></div>
    <div><div class="k">Horário</div><div class="v" id="hora"></div></div>
    <div><div class="k" id="rot-imp">Implantador</div><div class="v" id="imp"></div></div>
  </section>

  <form id="f" novalidate hidden>
    <div class="q"><label for="nome">Seu nome</label><input type="text" id="nome" autocomplete="name" placeholder="Ex.: Paula Souza" maxlength="80"></div>
    <fieldset class="q"><legend>Como foi a sessão?</legend>
      <div class="opcoes" id="nota" role="group" aria-label="Nota de 1 a 5"><button type="button" data-v="1">1</button><button type="button" data-v="2">2</button><button type="button" data-v="3">3</button><button type="button" data-v="4">4</button><button type="button" data-v="5">5</button></div>
      <div class="escala"><span>Ruim</span><span>Ótima</span></div>
    </fieldset>
    <fieldset class="q"><legend>Suas dúvidas foram resolvidas?</legend>
      <div class="opcoes" id="duvidas" role="group" aria-label="Dúvidas resolvidas"><button type="button" data-v="sim">Sim</button><button type="button" data-v="em parte">Em parte</button><button type="button" data-v="nao">Não</button></div>
    </fieldset>
    <p class="erro" id="erro" role="alert"></p>
    <button type="submit" class="enviar" id="enviar">Enviar</button>
  </form>

  <section class="aviso" id="aviso" hidden><div class="marca" id="marca" hidden>✓</div><h2 id="aviso-tit"></h2><p class="sub" id="aviso-sub"></p></section>
</main>
<script>
(() => {
  // Endereço do Painel da Implantação (Apps Script). O código da sessão vem no QR: ?s=<código>
  const API = 'https://script.google.com/macros/s/AKfycbxmCmfv-BK2xOwfg3B1MgUpGEUCVqqeJ47zQRg_FGra1kPHATg-7VX7KH_fybuvqLkVmw/exec';
  const cod = (new URLSearchParams(location.search).get('s') || '').slice(0, 40);
  const $ = (id) => document.getElementById(id);
  const DIAS = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
  // Sem cookies: assim a conta Google logada no celular não interfere.
  const chamar = async (corpo) => { const r = await fetch(API, { method: 'POST', body: JSON.stringify(corpo), credentials: 'omit', redirect: 'follow' }); return r.json(); };
  const aviso = (tit, sub, ok) => { $('carregando').hidden = true; $('f').hidden = true; $('aviso').hidden = false; $('aviso-tit').textContent = tit; $('aviso-sub').textContent = sub || ''; $('marca').hidden = !ok; };

  (async () => {
    if (!cod) return aviso('Sessão indisponível', 'Este código não corresponde a uma sessão ativa.');
    let r; try { r = await chamar({ acao: 'avInfo', sessao: cod }); } catch (e) { return aviso('Sem conexão', 'Não foi possível carregar a sessão. Tente de novo em instantes.'); }
    if (!r || !r.ok) return aviso('Sessão indisponível', 'Este código não corresponde a uma sessão ativa.');
    const s = r.sessao, d = new Date(s.data + 'T12:00:00Z');
    $('cli').textContent = s.cliente; $('ct').textContent = `Contrato ${s.contrato} · ${s.tipo}`;
    $('data').textContent = `${DIAS[d.getUTCDay()]}, ${s.data.slice(8, 10)}/${s.data.slice(5, 7)}/${s.data.slice(0, 4)}`;
    $('hora').textContent = `${s.inicio} – ${s.fim}`; $('imp').textContent = s.implantador; $('rot-imp').textContent = s.fem ? 'Implantadora' : 'Implantador';
    $('carregando').hidden = true; $('cab').hidden = false; $('dados').hidden = false;
    if (r.janela === 'antes') return aviso('A avaliação abre no início da sessão', 'Volte a este código ao final da sessão.');
    if (r.janela === 'depois') return aviso('O prazo para avaliar esta sessão terminou');
    $('f').hidden = false;
  })();

  const esc = { nota: '', duvidas: '' };
  for (const g of ['nota', 'duvidas']) $(g).addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return; esc[g] = b.dataset.v; $('erro').textContent = '';
    $(g).querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  });
  $('nome').addEventListener('input', () => { $('erro').textContent = ''; });
  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const nome = $('nome').value.trim();
    if (!nome) { $('erro').textContent = 'Informe seu nome.'; $('nome').focus(); return; }
    if (!esc.nota) { $('erro').textContent = 'Escolha uma nota de 1 a 5.'; return; }
    if (!esc.duvidas) { $('erro').textContent = 'Responda se as dúvidas foram resolvidas.'; return; }
    $('enviar').disabled = true; $('enviar').textContent = 'Enviando…';
    let r = null; try { r = await chamar({ acao: 'avaliar', sessao: cod, nome, nota: Number(esc.nota), duvidas: esc.duvidas }); } catch (err) { r = null; }
    if (r && r.ok) return aviso(`Obrigado, ${nome.split(' ')[0]}!`, 'Sua avaliação foi registrada.', true);
    $('erro').textContent = r && r.erro === 'prazo' ? 'O prazo para avaliar esta sessão terminou.' : 'Não foi possível enviar. Tente de novo.';
    $('enviar').disabled = false; $('enviar').textContent = 'Enviar';
  });
})();
</script>
</body>
</html>
